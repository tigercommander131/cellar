# Publishes packs.json and the game-fix profiles whenever they change on main.
name: Packs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profiles/**", "packs.json", "scripts/publish-packs.sh"]

permissions:
  contents: write

# One at a time, in order: two quick pushes mustn't finish the wrong way round and leave the older one live.
concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-packs.sh
