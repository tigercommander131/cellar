# Generate the Xcode project with: xcodegen generate
name: Cellar
options:
  minimumXcodeGenVersion: "2.42.0"
  bundleIdPrefix: com.tigercommander131
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  CellarKit:
    path: Packages/CellarKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

schemes:
  Cellar:
    build:
      targets:
        Cellar: all
    run:
      config: Debug

targets:
  Cellar:
    type: application
    platform: macOS
    sources: [Cellar]
    dependencies:
      - package: CellarKit
        product: CellarKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tigercommander131.cellar
        PRODUCT_NAME: Cellar
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Cellar/Cellar.entitlements
    info:
      path: Cellar/Info.plist
      properties:
        CFBundleDisplayName: Cellar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.games
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: "Games use the microphone for voice chat."
        SUFeedURL: https://github.com/tigercommander131/cellar/releases/download/appcast/appcast.xml
        SUPublicEDKey: "Tx/j+4DT7pUa4v6tgXALSCMu1Y15Utw4Gh+ZZGQZojg="
        SUEnableAutomaticChecks: true
        CFBundleURLTypes:
          - CFBundleURLName: com.tigercommander131.cellar
            CFBundleURLSchemes: [cellar]
